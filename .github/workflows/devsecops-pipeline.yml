name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  # -------------------------------------------------------------
  # STAGE 1: LINTING & STATIC CODE ANALYSIS
  # -------------------------------------------------------------
  lint:
    name: Lint Manifests & Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lint Dockerfile (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: 01-app-deployment/Dockerfile
          failure-threshold: error

  # -------------------------------------------------------------
  # STAGE 2: BUILD & CONTAINER VULNERABILITY SCANNING
  # -------------------------------------------------------------
  build-and-scan:
    name: Build & Security Scan (Trivy)
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build local image for scanning
        run: |
          docker build -t local-test-image:${{ github.sha }} ./01-app-deployment

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'local-test-image:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails build if HIGH or CRITICAL vulnerabilities are found
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Production Image to Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMAGE_ID=$(echo ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }} | tr '[:upper:]' '[:lower:]')
          docker tag local-test-image:${{ github.sha }} $IMAGE_ID:latest
          docker tag local-test-image:${{ github.sha }} $IMAGE_ID:${{ github.sha }}
          docker push $IMAGE_ID:latest
          docker push $IMAGE_ID:${{ github.sha }}

  # -------------------------------------------------------------
  # STAGE 3: AUTOMATED CLUSTER DEPLOYMENT
  # -------------------------------------------------------------
  deploy:
    name: Deploy to OpenShift Cluster
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/oc-installer@v1
        with:
          oc_version: '4.13'

      - name: Authenticate to OpenShift Cluster
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: ${{ secrets.OPENSHIFT_SERVER }}
          openshift_token: ${{ secrets.OPENSHIFT_TOKEN }}
          insecure_skip_tls_verify: true
          namespace: ${{ secrets.OPENSHIFT_NAMESPACE }}

      - name: Deploy Application Manifests
        run: |
          oc apply -f 01-app-deployment/deployment.yaml
          oc apply -f 01-app-deployment/service.yaml

      - name: Apply Zero-Trust Network Policies
        run: |
          oc apply -f 02-network-security/default-deny.yaml
          oc apply -f 02-network-security/allow-frontend-to-backend.yaml

      - name: Verify Rollout Status
        run: |
          oc rollout status deployment/backend-app --timeout=60s